# Log and Order HTTP server.
# OLLAMA_BASE_URL is passed through unchanged. 127.0.0.1 inside this bridge
# network is the container, not the host. See the README for host, remote,
# and container networking.

services:
  log-and-order:
    build: .
    image: log-and-order
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOG_AND_ORDER_PUBLISH_PORT:-8080}:${LOG_AND_ORDER_PORT:-8080}"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?Set OLLAMA_BASE_URL to the Ollama server, for example http://192.168.1.100:11434}
      LOG_AND_ORDER_MODEL: ${LOG_AND_ORDER_MODEL:?Set LOG_AND_ORDER_MODEL to an Ollama model that is already installed}
      LOG_AND_ORDER_API_KEY: ${LOG_AND_ORDER_API_KEY:-}
      LOG_AND_ORDER_MAX_UPLOAD_MB: ${LOG_AND_ORDER_MAX_UPLOAD_MB:-32}
      LOG_AND_ORDER_OLLAMA_TIMEOUT: ${LOG_AND_ORDER_OLLAMA_TIMEOUT:-120}
      LOG_AND_ORDER_MAX_CONCURRENT_ANALYSES: ${LOG_AND_ORDER_MAX_CONCURRENT_ANALYSES:-1}
      LOG_AND_ORDER_HOST: 0.0.0.0
      LOG_AND_ORDER_PORT: ${LOG_AND_ORDER_PORT:-8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; port=os.environ.get('LOG_AND_ORDER_PORT', '8080'); urllib.request.urlopen('http://127.0.0.1:%s/api/v1/health' % port, timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
